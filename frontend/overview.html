<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千年诗境 · 诗词数据概览</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 数字卡片行 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 253, 247, 0.9);
            border: 1px solid rgba(201, 169, 110, 0.4);
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            position: relative;
        }
        .stat-card::before, .stat-card::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 2px solid var(--gold);
        }
        .stat-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .stat-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .stat-card .num {
            font-size: 32px;
            color: var(--ink-blue);
            font-weight: bold;
            font-family: "STKaiti", serif;
        }
        .stat-card .label {
            font-size: 13px;
            color: #8b7355;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        /* 朝代联动详情卡片 */
        .detail-panel {
            background: rgba(255, 253, 247, 0.92);
            border: 1px solid rgba(201, 169, 110, 0.4);
            padding: 20px 24px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            position: relative;
        }
        .detail-panel::before, .detail-panel::after {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            border: 2px solid var(--gold);
        }
        .detail-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .detail-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .detail-left h4 {
            color: var(--ink-blue);
            font-size: 20px;
            font-family: "STKaiti", "KaiTi", serif;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .detail-left .total {
            font-size: 14px;
            color: #8b7355;
            margin-bottom: 20px;
        }
        .detail-left .verse {
            font-size: 18px;
            color: var(--crimson);
            font-family: "STKaiti", "KaiTi", serif;
            letter-spacing: 2px;
            line-height: 1.8;
            padding-top: 15px;
            border-top: 1px dashed rgba(201, 169, 110, 0.5);
        }
        .detail-left .verse .src {
            font-size: 13px;
            color: #8b7355;
            display: block;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .detail-right h5 {
            color: #5a3e2b;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        #detailChart { width: 100%; height: 195px; }
        @media (max-width: 700px) {
            .detail-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-page="overview">
    <nav class="nav">
        <a href="index.html" class="logo" data-i18n="logo">千年诗境</a>
        <a href="dynasty.html" data-page="dynasty" data-i18n="nav.dynasty">朝代分析</a>
        <a href="poet.html" data-page="poet" data-i18n="nav.poet">诗人图谱</a>
        <a href="text.html" data-page="text" data-i18n="nav.text">诗词文本分析</a>
        <a href="imagery.html" data-page="imagery" data-i18n="nav.imagery">诗境意象</a>
        <a href="overview.html" data-page="overview" data-i18n="nav.overview">诗词数据概览</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 data-i18n="ov.title">诗词数据概览</h1>
            <p data-i18n="ov.sub">诗词类型与结构分析</p>
        </div>

        <!-- 数字卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="statTotal">—</div>
                <div class="label" data-i18n="ov.statTotal">诗词总数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statCategory">—</div>
                <div class="label" data-i18n="ov.statCategory">诗词类别数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statAvgLen">—</div>
                <div class="label" data-i18n="ov.statAvgLen">平均字数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statTopCat">—</div>
                <div class="label" data-i18n="ov.statTopCat">最常见类别</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3 data-i18n="ov.catPie">各诗词类别数量（点击扇区下钻）</h3>
                <div id="categoryPie" class="chart"></div>
            </div>
            <div class="card">
                <h3 data-i18n="ov.catTop">诗词类别 TopN</h3>
                <div id="categoryTop" class="chart"></div>
            </div>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3 data-i18n="ov.dynCat">朝代 × 类别 分布（点击柱段，下方联动查看朝代详情）</h3>
            <div id="dynastyCategory" class="chart" style="height:400px;"></div>

            <!-- 联动详情卡片 -->
            <div class="detail-panel">
                <div class="detail-left">
                    <h4 id="detailDynasty">唐代</h4>
                    <div class="total" id="detailTotal">—</div>
                    <div class="verse">
                        <span id="detailVerse">海上生明月，天涯共此时。</span>
                        <span class="src" id="detailVerseSrc">—— 张九龄《望月怀远》</span>
                    </div>
                </div>
                <div class="detail-right">
                    <h5 data-i18n="ov.detailTitle">该朝代各类别数量</h5>
                    <div id="detailChart"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 data-i18n="ov.lenRange">诗词长度区间分布（含平均线）</h3>
            <div id="lengthRange" class="chart"></div>
        </div>
    </div>

<script src="js/common.js"></script>
<script>
// ============ 模拟数据（内部用中文 key） ============
const categoryCount = {
    "古体诗": 52341, "近体诗": 38920, "词": 8200,
    "绝句": 6500, "律诗": 4200, "乐府": 1800, "其他": 1500
};
const categoryTopN = Object.entries(categoryCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
const dynKeys = ["唐代", "宋代", "元代", "明代", "清代", "魏晋", "先秦"];
const catKeys = ["古体诗", "近体诗", "词", "绝句", "律诗"];
const dynastyCategoryData = {
    "古体诗": [18200, 9800, 2100, 7600, 8900, 3200, 541],
    "近体诗": [15600, 11200, 980, 4300, 5800, 800, 20],
    "词":     [1200,  6800,  400,  100,  300,  50,  50],
    "绝句":   [3200,  2100,  300,  400,  450,   50,   0],
    "律诗":   [2800,  1500,  120,  300,  500,   30,   0]
};
const lengthRangeData = {
    "0-20": 12000, "21-50": 45000, "51-100": 32000, "101-200": 15000, "200+": 5643
};
const dt = k => t('dyn.' + k);   // 朝代显示名
const ct = k => t('cat.' + k);   // 类别显示名

// 各朝代代表诗句（模拟，接后端后可换成接口数据；诗词本身不翻译）
const dynastyPoem = {
    "唐代": { verse: "海上生明月，天涯共此时。", src: "张九龄《望月怀远》" },
    "宋代": { verse: "山重水复疑无路，柳暗花明又一村。", src: "陆游《游山西村》" },
    "元代": { verse: "枯藤老树昏鸦，小桥流水人家。", src: "马致远《天净沙·秋思》" },
    "明代": { verse: "千锤万凿出深山，烈火焚烧若等闲。", src: "于谦《石灰吟》" },
    "清代": { verse: "九州生气恃风雷，万马齐喑究可哀。", src: "龚自珍《己亥杂诗》" },
    "魏晋": { verse: "采菊东篱下，悠然见南山。", src: "陶渊明《饮酒》" },
    "先秦": { verse: "关关雎鸠，在河之洲。", src: "《诗经·关雎》" }
};

// 图表实例（只初始化一次）
const pieChart = echarts.init(document.getElementById('categoryPie'));
const catTopChart = echarts.init(document.getElementById('categoryTop'));
const dynastyChart = echarts.init(document.getElementById('dynastyCategory'));
const detailChart = echarts.init(document.getElementById('detailChart'));
const lenChart = echarts.init(document.getElementById('lengthRange'));

let curIdx = 0;
function updateDetail(i) {
    curIdx = i;
    const key = dynKeys[i];
    const name = dt(key);
    const values = catKeys.map(cat => dynastyCategoryData[cat][i]);
    const total = values.reduce((a, b) => a + b, 0);
    document.getElementById('detailDynasty').textContent = name;
    document.getElementById('detailTotal').textContent =
        `${t('ov.totalPrefix')} ${total.toLocaleString()} ${t('ov.totalSuffix')}`;
    const p = dynastyPoem[key] || {};
    document.getElementById('detailVerse').textContent = p.verse || t('ov.noVerse');
    document.getElementById('detailVerseSrc').textContent = p.src ? '—— ' + p.src : '';
    detailChart.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 40, right: 20, top: 10, bottom: 42 },
        xAxis: { type: 'category', data: catKeys.map(ct), axisLabel: { interval: 0, fontSize: 12 } },
        yAxis: { type: 'value', show: false },
        color: THEME_COLORS,
        series: [{
            type: 'bar', data: values,
            barWidth: '45%',
            itemStyle: { borderRadius: [3, 3, 0, 0] },
            label: { show: true, position: 'top', fontSize: 10 }
        }]
    }, true);
}

function renderOverview() {
    // 顶部数字卡片
    const total = Object.values(categoryCount).reduce((a, b) => a + b, 0);
    const topCat = categoryTopN[0][0];
    const avgLen = Math.round(
        (0*12000 + 35*45000 + 75*32000 + 150*15000 + 250*5643) / total
    );
    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statCategory').textContent = Object.keys(categoryCount).length;
    document.getElementById('statAvgLen').textContent = avgLen + ' ' + t('ov.lenUnit');
    document.getElementById('statTopCat').textContent = ct(topCat);

    // 1. 饼图（点击下钻）
    pieChart.setOption({
        tooltip: {
            trigger: 'item',
            formatter: p => `${p.name}: ${p.value} ${t('ov.totalSuffix')} (${p.percent}%)`
        },
        legend: { bottom: 0, type: 'scroll' },
        color: THEME_COLORS,
        series: [{
            type: 'pie', radius: ['40%', '70%'],
            label: { show: true, formatter: '{b}\n{d}%' },
            data: Object.entries(categoryCount).map(([name, value]) => ({ name: ct(name), value }))
        }]
    }, true);

    // 2. TopN 横向条形图
    catTopChart.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 100, right: 40, top: 10, bottom: 30 },
        xAxis: { type: 'value' },
        yAxis: { type: 'category', data: categoryTopN.map(x => ct(x[0])).reverse() },
        series: [{
            type: 'bar', data: categoryTopN.map(x => x[1]).reverse(),
            itemStyle: { color: '#77171C', borderRadius: [0, 4, 4, 0] },
            label: { show: true, position: 'right' }
        }]
    }, true);

    // 3. 堆叠图（legend可筛选 + 点击联动）
    dynastyChart.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        legend: { data: catKeys.map(ct), top: 0, selectedMode: 'multiple' },
        grid: { left: 60, right: 30, top: 40, bottom: 30 },
        xAxis: { type: 'category', data: dynKeys.map(dt) },
        yAxis: { type: 'value', name: t('ov.quantity') },
        color: THEME_COLORS,
        series: catKeys.map(cat => ({
            name: ct(cat), type: 'bar', stack: 'total', data: dynastyCategoryData[cat]
        }))
    }, true);

    // 4. 长度区间（加平均线）
    lenChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 60, right: 60, top: 30, bottom: 30 },
        xAxis: { type: 'category', data: Object.keys(lengthRangeData), name: t('ov.rangeName') },
        yAxis: { type: 'value', name: t('ov.poemCount') },
        color: THEME_COLORS,
        series: [{
            type: 'bar', data: Object.values(lengthRangeData),
            itemStyle: { color: '#19325F', borderRadius: [4, 4, 0, 0] },
            label: { show: true, position: 'top' },
            markLine: {
                data: [{ type: 'average', name: t('ov.average') }],
                lineStyle: { color: '#77171C', type: 'dashed' },
                label: { formatter: t('ov.avgFmt') }
            }
        }]
    }, true);

    updateDetail(curIdx);
}

// 点击饼图扇区，alert该类别详情（下钻效果）
pieChart.on('click', function(params) {
    alert(`【${params.name}】\n${t('ov.quantity')}: ${params.value} ${t('ov.totalSuffix')}\n${t('ov.share')}: ${params.percent}%`);
});
// 点击堆叠图任意一段 -> 联动更新详情
dynastyChart.on('click', function(params) {
    updateDetail(params.dataIndex);
});

document.addEventListener('DOMContentLoaded', renderOverview);
window.addEventListener('langchange', renderOverview);
window.addEventListener('resize', () => {
    document.querySelectorAll('.chart').forEach(el => echarts.getInstanceByDom(el)?.resize());
});
</script>
</body>
</html>
