<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千年诗境 · 诗境意象</title>
    <script src="js/echarts.min.js?v=2"></script>
    <script src="js/echarts-wordcloud.min.js?v=2"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ==== 长卷基底（对齐 dynasty.html） ==== */
        body { background: #f0e8d0; }
        .scroll-wrap { position:relative; max-width: 1400px; margin: 0 auto; padding: 0 40px 120px; }
        .ink-bg { position: fixed; inset: 0; z-index: -1; opacity:.5; pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(45,74,62,.08), transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 30%, rgba(139,46,46,.06), transparent 60%),
                radial-gradient(ellipse 70% 50% at 50% 90%, rgba(201,169,110,.10), transparent 60%),
                linear-gradient(#f0e8d0, #ece2c8);
        }
        /* ==== Hero ==== */
        .hero { text-align:center; padding: 60px 0 30px; }
        .hero h1 { font-family:"STKaiti","SimSun",serif; font-size:48px; color:#2D4A3E; margin:0 0 12px; letter-spacing:8px; }
        .hero .sub { font-size:16px; color:#5a6b5e; font-family:"STKaiti",serif; }
        /* ==== 章节 ==== */
        .section { margin: 40px 0; opacity:0; transform: translateY(30px); transition: opacity .9s ease, transform .9s ease; }
        .section.in { opacity:1; transform: translateY(0); }
        .sec-tag { display:inline-flex; align-items:center; gap:10px; font-size:14px; color:#8B2E2E; letter-spacing:2px; margin-bottom:8px; }
        .sec-tag::before { content:''; width:3px; height:16px; background:#8B2E2E; }
        .sec-title { font-family:"STKaiti","SimSun",serif; font-size:26px; color:#2D4A3E; margin:0 0 6px; letter-spacing:3px; }
        .sec-desc { font-size:13px; color:#9a8a70; margin-bottom:20px; }
        .sec-ink { background: linear-gradient(180deg, rgba(255,253,247,.5), rgba(255,253,247,.35)); border:none; border-top:1px solid rgba(201,169,110,.2); border-bottom:1px solid rgba(201,169,110,.2); padding:24px; position:relative; }
        .sec-ink::before, .sec-ink::after { content:''; position:absolute; width:10px; height:10px; border:1px solid #C9A96E; }
        .sec-ink::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
        .sec-ink::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
        .brush { height:2px; background: linear-gradient(90deg, transparent, #C9A96E 20%, #C9A96E 80%, transparent); margin:0; opacity:.4; }
        /* ==== KPI ==== */
        .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin:30px 0; }
        .kpi-card { background: rgba(255,253,247,.55); border:1px solid rgba(201,169,110,.3); border-radius:2px; padding:20px; text-align:center; backdrop-filter: blur(2px); }
        .kpi-card .k-num { font-size:32px; color:#2D4A3E; font-weight:bold; font-family:"STKaiti",serif; }
        .kpi-card .k-label { font-size:13px; color:#8b7355; margin-top:6px; letter-spacing:2px; }
        @media (max-width:900px){ .kpi-row{grid-template-columns:repeat(2,1fr)} .scroll-wrap{padding:0 20px 80px} }
        /* ==== 两列 ==== */
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
        @media (max-width:900px){ .two-col{grid-template-columns:1fr} }
        /* ==== 朝代卡片 ==== */
        .dyn-card-group { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
        .dyn-card { padding:8px 18px; border:1px solid rgba(201,169,110,.45); border-radius:6px; background:rgba(255,253,247,.7); cursor:pointer; transition:all 0.22s ease; font-size:14px; color:#5a3e2b; }
        .dyn-card:hover { box-shadow:0 2px 6px rgba(201,169,110,.25); transform:translateY(-2px); }
        .dyn-card.active { background:#2D4A3E; color:#fff; border-color:#2D4A3E; }
        /* ==== 诗人面板 ==== */
        .author-panel { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
        .author-panel select, .author-panel input { padding:8px 12px; border:1px solid rgba(201,169,110,.5); border-radius:4px; font-family:inherit; background:#fffdf7; outline:none; }
        /* ==== 诗句面板 ==== */
        .sentence-panel { margin-top:16px; padding:20px 24px; background: linear-gradient(180deg, rgba(255,253,247,.7), rgba(255,253,247,.5)); border:1px solid rgba(201,169,110,.35); border-radius:4px; position:relative; min-height:80px; display:flex; flex-direction:column; justify-content:center; }
        .sentence-panel::before, .sentence-panel::after { content:''; position:absolute; width:8px; height:8px; border:1px solid #C9A96E; }
        .sentence-panel::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
        .sentence-panel::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
        .sentence-hint { text-align:center; color:#b0a080; font-size:14px; letter-spacing:2px; font-family:"STKaiti",serif; }
        .sentence-title { font-size:14px; color:#8B2E2E; margin-bottom:10px; letter-spacing:1px; }
        .sentence-text { font-size:22px; color:#2D4A3E; font-family:"STKaiti","KaiTi",serif; line-height:1.8; letter-spacing:2px; }
        .sentence-source { font-size:12px; color:#a09070; margin-top:8px; text-align:right; }
        .chart { width:100%; }
    </style>
</head>
<body data-page="imagery">
    <!-- 淡墨山水背景 -->
    <div class="ink-bg" style="background:
        linear-gradient(rgba(240,232,208,.82), rgba(236,226,200,.88)),
        url('img/landscape.jpg') center/cover no-repeat fixed;"></div>

    <nav class="nav">
        <a href="index.html" class="logo" data-i18n="logo">千年诗境</a>
        <a href="dynasty.html" data-page="dynasty" data-i18n="nav.dynasty">朝代分析</a>
        <a href="poet.html" data-page="poet" data-i18n="nav.poet">诗人图谱</a>
        <a href="text.html" data-page="text" data-i18n="nav.text">诗词文本分析</a>
        <a href="imagery.html" data-page="imagery" data-i18n="nav.imagery">诗境意象</a>
        <a href="overview.html" data-page="overview" data-i18n="nav.overview">诗词数据概览</a>
    </nav>

    <div class="scroll-wrap">
        <!-- Hero -->
        <div class="hero">
            <h1 data-i18n="im.title">诗境意象</h1>
            <p class="sub" data-i18n="im.sub">意象出现次数、意象 TopN、朝代×意象、作者×意象</p>
        </div>

        <!-- KPI -->
        <div class="kpi-row">
            <div class="kpi-card"><div class="k-num" id="kTotal">—</div><div class="k-label" data-i18n="im.kTotal">意象种类</div></div>
            <div class="kpi-card"><div class="k-num" id="kPoems">—</div><div class="k-label" data-i18n="im.kPoems">诗词总量</div></div>
            <div class="kpi-card"><div class="k-num" id="kDyn">—</div><div class="k-label" data-i18n="im.kDyn">覆盖朝代</div></div>
            <div class="kpi-card"><div class="k-num" id="kAuth">—</div><div class="k-label" data-i18n="im.kAuth">覆盖诗人</div></div>
        </div>

        <div class="brush"></div>

        <!-- 词云 + Top10 -->
        <div class="section">
            <div class="sec-tag" data-i18n="im.cloud">高频意象词云</div>
            <div class="two-col">
                <div class="sec-ink">
                    <div id="cloudChart" class="chart" style="height:380px;"></div>
                </div>
                <div class="sec-ink">
                    <div id="top10Chart" class="chart" style="height:380px;"></div>
                </div>
            </div>
        </div>

        <div class="brush"></div>

        <!-- 朝代意象分布 -->
        <div class="section">
            <div class="sec-tag" data-i18n="im.c3">朝代意象分布</div>
            <div class="sec-ink">
                <div class="dyn-card-group" id="dynCardGroup"></div>
                <div id="byDynChart" class="chart" style="height:380px;margin-top:8px;"></div>
            </div>
        </div>

        <div class="brush"></div>

        <!-- 意象关联热力图 -->
        <div class="section">
            <div class="sec-tag" data-i18n="im.heatTitle">意象关联热力图</div>
            <p class="sec-desc" data-i18n="im.heatDesc">高频意象共现频次（同一首诗词中共同出现次数）</p>
            <div class="sec-ink">
                <div id="heatChart" class="chart" style="height:500px;"></div>
            </div>
        </div>

        <div class="brush"></div>

        <!-- 作者意象偏好 -->
        <div class="section">
            <div class="sec-tag" data-i18n="im.c4">诗人意象偏好</div>
            <div class="sec-ink">
                <div class="author-panel">
                    <span style="font-size:13px;color:#8b7355;" data-i18n="im.quickPoet">快速选择诗人：</span>
                    <input id="authorSearch" placeholder="输入诗人姓名搜索..." style="width:180px;">
                    <select id="authorSel"></select>
                </div>
                <div id="byAuthChart" class="chart" style="height:380px;"></div>
                <div class="sentence-panel" id="sentencePanel">
                    <div class="sentence-hint" data-i18n="im.clickSentence">点击饼图意象区块，查看该诗人与此意象相关的诗句</div>
                </div>
            </div>
        </div>
    </div>

<script src="js/common.js?v=3"></script>
<script>
    const cloudChart = echarts.init(document.getElementById('cloudChart'));
    const top10Chart = echarts.init(document.getElementById('top10Chart'));
    const byDynChart = echarts.init(document.getElementById('byDynChart'));
    const byAuthChart = echarts.init(document.getElementById('byAuthChart'));
    const heatChart = echarts.init(document.getElementById('heatChart'));

    let DATA = null;
    let currentDyn = '';
    let allPoetOptions = [];
    let currentPoet = '';

    async function loadData() {
        const [meta, total, topn, bd, ba] = await Promise.all([
            fetchAPI('/imagery/meta'),
            fetchAPI('/imagery/total'),
            fetchAPI('/imagery/topn'),
            fetchAPI('/imagery/by-dynasty'),
            fetchAPI('/imagery/by-author')
        ]);
        return { meta: meta || {}, total: total || [], topn: topn || [], bd: bd || {}, ba: ba || {} };
    }

    function renderKPI() {
        document.getElementById('kTotal').textContent = DATA.total.length;
        document.getElementById('kPoems').textContent = (DATA.meta.poemCount || 0).toLocaleString();
        document.getElementById('kDyn').textContent = DATA.meta.dynastyCount || 0;
        document.getElementById('kAuth').textContent = (DATA.meta.authorCount || 0).toLocaleString();
    }

    function renderCloud() {
        cloudChart.setOption({
            tooltip: { show: true, formatter: p => p.name + '：' + p.value + ' ' + t('im.times') },
            series: [{
                type: 'wordCloud', sizeRange: [18, 72], rotationRange: [-30, 30],
                gridSize: 6, shape: 'circle', drawOutOfBound: false,
                textStyle: { fontFamily: 'STKaiti, KaiTi, serif', color: () => THEME_COLORS[Math.floor(Math.random()*THEME_COLORS.length)] },
                emphasis: { textStyle: { textShadowBlur: 8, textShadowColor: 'rgba(0,0,0,0.3)' } },
                data: DATA.total.map(x => ({ name: x.imagery, value: x.count }))
            }]
        }, true);
    }

    function renderTop10() {
        const t = DATA.topn.slice().reverse();
        top10Chart.setOption({
            tooltip: { trigger:'axis', axisPointer:{ type:'shadow' } },
            grid: { left:60, right:40, top:20, bottom:30 },
            xAxis: { type:'value' }, yAxis: { type:'category', data:t.map(x=>x.imagery) },
            series: [{ type:'bar', data:t.map(x=>x.count),
                itemStyle:{ color:'#A33F32', borderRadius:[0,4,4,0] }, label:{ show:true, position:'right' } }]
        }, true);
    }

    function renderDynCards() {
        const group = document.getElementById('dynCardGroup');
        const dynList = [
            { dynVal:"", i18nKey:"all" },
            { dynVal:"战国", i18nKey:"dyn.战国" },
            { dynVal:"东汉", i18nKey:"dyn.东汉" },
            { dynVal:"唐代", i18nKey:"dyn.唐代" },
            { dynVal:"宋代", i18nKey:"dyn.宋代" },
            { dynVal:"元代", i18nKey:"dyn.元代" },
            { dynVal:"清代", i18nKey:"dyn.清代" }
        ];
        let html = '';
        dynList.forEach(item => {
            const active = item.dynVal === currentDyn ? 'active' : '';
            html += '<div class="dyn-card ' + active + '" data-dyn="' + item.dynVal + '">' + t(item.i18nKey) + '</div>';
        });
        group.innerHTML = html;
    }

    function renderDyn(dyn) {
        currentDyn = dyn || '';
        byDynChart.clear();
        const dynOrderList = ["战国","东汉","唐代","宋代","元代","清代"];

        if (!dyn) {
            const listAll = [];
            for (const dynName of dynOrderList) {
                const arr = DATA.bd[dynName] || [];
                const sortedArr = [...arr].filter(item=>item.count>0).sort((a,b)=>b.count-a.count);
                sortedArr.forEach(item => listAll.push({ name: trDyn(dynName)+" · "+item.imagery, value: item.count }));
            }
            const xData = listAll.map(i=>i.name);
            const yData = listAll.map(i=>i.value);
            byDynChart.setOption({
                tooltip: { trigger:'axis', axisPointer:{ type:'cross', lineStyle:{ type:'dashed', color:'#777', width:1 } },
                    formatter: params => params[0].axisValue + '<br/>' + t('im.count') + '：' + params[0].value },
                grid: { left:70, right:30, top:20, bottom:130 },
                dataZoom: [
                    { type:'inside', xAxisIndex:0, start:0, end:55 },
                    { type:'slider', xAxisIndex:0, show:true, height:18, bottom:20, start:0, end:55 }
                ],
                xAxis: { type:'category', data:xData, axisLabel:{ interval:0, rotate:45, fontSize:11, color:'#3b2f22' },
                    axisLine:{ lineStyle:{ color:'#b8a486' } } },
                yAxis: { type:'value', name:t('im.count'), nameGap:22, splitLine:{ lineStyle:{ color:'#f3efe8' } } },
                series: [{ type:'bar', data:yData, itemStyle:{ color:'#3D6036', borderRadius:[4,4,0,0] } }]
            }, true);
        } else {
            const list = (DATA.bd[dyn]||[]).slice();
            byDynChart.setOption({
                tooltip: { trigger:'axis', axisPointer:{ type:'cross', lineStyle:{ type:'dashed', color:'#777', width:1 } },
                    formatter: params => trDyn(dyn) + ' · ' + params[0].name + '<br/>' + t('im.count') + '：' + params[0].value },
                grid: { left:70, right:20, top:20, bottom:130 },
                dataZoom: [
                    { type:'inside', xAxisIndex:0, start:0, end:70 },
                    { type:'slider', xAxisIndex:0, show:true, height:18, bottom:20, start:0, end:70 }
                ],
                xAxis: { type:'category', data:list.map(x=>x.imagery), axisLabel:{ interval:0, rotate:45, fontSize:12, color:'#3b2f22' },
                    axisLine:{ lineStyle:{ color:'#b8a486' } } },
                yAxis: { type:'value', name:t('im.count'), nameGap:22, splitLine:{ lineStyle:{ color:'#f3efe8' } } },
                color: THEME_COLORS,
                series: [{ type:'bar', data:list.map(x=>x.count), itemStyle:{ color:'#3D6036', borderRadius:[4,4,0,0] } }]
            }, true);
        }
    }

    async function renderHeat(dyn) {
        const res = await fetchAPI('/imagery/correlation?dynasty=' + encodeURIComponent(dyn || ''));
        if (!res || !res.labels || !res.data || res.labels.length === 0) {
            heatChart.clear();
            heatChart.setOption({ title: { text: t('im.heatEmpty'), left:'center', top:'center',
                textStyle:{ color:'#b0a080', fontSize:16, fontFamily:'STKaiti, serif' } } });
            return;
        }
        const labels = res.labels;
        const matrix = res.data;
        const heatData = [];
        let maxVal = 0;
        for (let i = 0; i < labels.length; i++) {
            for (let j = 0; j < labels.length; j++) {
                const v = matrix[i][j] || 0;
                if (v > maxVal) maxVal = v;
                heatData.push([j, i, v]);
            }
        }
        heatChart.setOption({
            tooltip: { formatter: p => labels[p.value[1]] + ' × ' + labels[p.value[0]] + '<br/>' + t('im.coOccur') + '：' + p.value[2] },
            grid: { left:70, right:90, top:30, bottom:50 },
            xAxis: { type:'category', data:labels, splitArea:{ show:true },
                axisLabel:{ color:'#3b2f22', fontSize:13, fontWeight:'bold' } },
            yAxis: { type:'category', data:labels, splitArea:{ show:true },
                axisLabel:{ color:'#3b2f22', fontSize:13, fontWeight:'bold' } },
            visualMap: { min:0, max:maxVal, calculable:true, orient:'vertical', right:10, top:'center',
                inRange: { color:['#f5ecd7', '#e8d5a8', '#C9A96E', '#b8543f', '#8B2E2E', '#2D4A3E'] },
                textStyle:{ color:'#8b7355' },
                text: [t('im.high'), t('im.low')] },
            series: [{ type:'heatmap', data:heatData,
                label:{ show:true, fontSize:11, color:'#3b2f22', fontWeight:'bold' },
                emphasis:{ itemStyle:{ shadowBlur:10, shadowColor:'rgba(0,0,0,0.3)' } } }]
        }, true);
    }

    function renderAuthor(name) {
        if (!DATA.ba[name]) { name = Object.keys(DATA.ba)[0]; }
        currentPoet = name;
        resetSentencePanel();
        const list = DATA.ba[name] || [];
        byAuthChart.setOption({
            tooltip: { trigger:'item', formatter: p => p.name + '：' + p.value + ' ' + t('im.times') + ' (' + p.percent + '%)' },
            legend: { orient:'vertical', right:10, top:'center', type:'scroll',
                textStyle:{ fontSize:12, color:'#5a3e2b' } },
            title: { text: name, left:'38%', top:'55%',
                textAlign:'center', textVerticalAlign:'middle',
                textStyle:{ fontSize:22, color:'#2D4A3E', fontFamily:'STKaiti, serif', fontWeight:'bold' } },
            series: [{ type:'pie', radius:['40%','65%'], center:['38%','55%'],
                itemStyle:{ borderColor:'#fffdf7', borderWidth:2 },
                emphasis:{ itemStyle:{ shadowBlur:10, shadowColor:'rgba(0,0,0,0.15)' } },
                color:['#2D4A3E','#8B2E2E','#C9A96E','#505970','#945946','#967859','#746356','#b49b77'],
                data: list.map(x=>({ name:x.imagery, value:x.count })) }]
        }, true);
    }

    function resetSentencePanel() {
        document.getElementById('sentencePanel').innerHTML =
            '<div class="sentence-hint">' + t('im.clickSentence') + '</div>';
    }

    async function renderSentence(poet, imagery) {
        const panel = document.getElementById('sentencePanel');
        const res = await fetchAPI('/imagery/poetSentence?poet=' + encodeURIComponent(poet) + '&imagery=' + encodeURIComponent(imagery));
        if (!res || !res.sentence) {
            panel.innerHTML = '<div class="sentence-title">' + poet + ' · ' + imagery + '</div>' +
                '<div class="sentence-hint">' + t('im.noSentence') + '</div>';
            return;
        }
        panel.innerHTML =
            '<div class="sentence-title">' + poet + ' · ' + imagery + '</div>' +
            '<div class="sentence-text">「' + res.sentence + '」</div>' +
            '<div class="sentence-source">—— ' + poet + '《' + (res.title || '无题') + '》</div>';
    }

    function fillPoetSelect() {
        const sel = document.getElementById('authorSel');
        const poets = Object.keys(DATA.ba);
        allPoetOptions = poets.map(p=>({text:p, value:p}));
        sel.innerHTML = allPoetOptions.map(opt=>'<option value="'+opt.value+'">'+opt.text+'</option>').join('');
    }

    async function boot() {
        DATA = await loadData();
        renderKPI(); renderCloud(); renderTop10(); renderDyn(''); renderHeat('');
        renderDynCards(); fillPoetSelect();
        renderAuthor(document.getElementById('authorSel').value);
        // 滚动入场动画
        const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }); }, { threshold:0.1 });
        document.querySelectorAll('.section').forEach(s => io.observe(s));
    }

    document.getElementById('dynCardGroup').addEventListener('click', e => {
        const card = e.target.closest('.dyn-card');
        if (!card) return;
        document.querySelectorAll('.dyn-card').forEach(c=>c.classList.remove('active'));
        card.classList.add('active');
        const dynVal = card.dataset.dyn || '';
        renderDyn(dynVal); renderHeat(dynVal);
    });

    document.getElementById('authorSel').addEventListener('change', e => {
        document.getElementById('authorSearch').value = e.target.value;
        renderAuthor(e.target.value);
    });

    document.getElementById('authorSearch').addEventListener('input', e => {
        const kw = e.target.value.trim().toLowerCase();
        const sel = document.getElementById('authorSel');
        sel.innerHTML = '';
        allPoetOptions.filter(opt => opt.text.toLowerCase().includes(kw)).forEach(opt => {
            const o = document.createElement('option'); o.value = opt.value; o.textContent = opt.text; sel.appendChild(o);
        });
    });

    document.getElementById('authorSearch').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const sel = document.getElementById('authorSel');
            if (sel.options.length > 0) {
                sel.value = sel.options[0].value;
                document.getElementById('authorSearch').value = sel.value;
                renderAuthor(sel.value);
            }
        }
    });

    function onLangChange() {
        if (!DATA) return;
        renderKPI(); renderCloud(); renderTop10(); renderDyn(currentDyn); renderHeat(currentDyn);
        renderDynCards(); renderAuthor(document.getElementById('authorSel').value);
    }

    byAuthChart.on('click', function(params) {
        if (params.seriesType === 'pie' && currentPoet && params.name) { renderSentence(currentPoet, params.name); }
    });

    window.addEventListener('langchange', onLangChange);
    document.addEventListener('DOMContentLoaded', boot);
    window.addEventListener('resize', () => {
        document.querySelectorAll('.chart').forEach(el => echarts.getInstanceByDom(el)?.resize());
    });
</script>
</body>
</html>
