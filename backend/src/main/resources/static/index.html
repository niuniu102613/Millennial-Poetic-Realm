        /* 背景图层（承载水墨背景图，可切换） */
        .bg-layer {
            position: fixed;

            z-index: 0;
            background: url('img/bg-home.jpg') center/cover no-repeat fixed;
            transition: opacity 0.6s ease;
        }

        /* 飘诗层 */
.fly-layer { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.fly-poem { position: absolute; top: 95vh; display: inline-block; font-family: "Liu Jian Mao Cao", "Zhi Mang Xing", "Ma Shan Zheng", "STKaiti", cursive; color: rgba(40,30,20,0.85); text-shadow: 1px 1px 4px rgba(245,239,224,0.8); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 8px; white-space: nowrap; opacity: 0; animation: rise 20s linear forwards; }
@keyframes rise {
  0% { top: 95vh; opacity: 0; }
  10% { opacity: 0.8; }
  85% { opacity: 0.8; }
  100% { top: -25vh; opacity: 0; }
}
.fly-poem .au { display:block; font-size:.35em; opacity:.6; margin-top:10px; letter-spacing:2px; }

        /* 换景按钮 */
        .bg-switch {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 300;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(255, 253, 247, 0.85);
            border: 2px solid var(--gold);
            color: var(--ink-blue);
            font-size: 13px;
            font-family: "STKaiti", "KaiTi", serif;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 3px 12px rgba(25, 50, 95, 0.2);
            transition: all 0.25s;
        }
        .bg-switch .icon { font-size: 18px; margin-bottom: 1px; }
        .bg-switch:hover {
            background: var(--ink-blue);
            color: #fff;
            transform: rotate(20deg);
        }

        /* 主内容 */
        .main-content {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 20px;
        }
        .main-content h1 {
            text-align: center;
            font-size: clamp(36px, 6vw, 56px);
            color: var(--ink-blue);
            letter-spacing: 10px;
            font-family: "STKaiti", "KaiTi", serif;
            margin-bottom: 15px;
            position: relative;
            padding: 20px 60px;

            text-align: center;
            position: relative;
            margin-bottom: 15px;

            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);

        .title-wrap::after { right: calc(50% - 220px); }

        .title-deco {

            color: var(--gold);

            letter-spacing: 16px;

const flyLayer = document.getElementById("flyLayer");
const usedCols = new Set();
function spawnFly() {
    if(usedCols.size >= 9) return;
    // 9 个固定列位置
    const cols = [2,12,22,32,42,55,68,80,90];
    let avail = cols.filter(c=>!usedCols.has(c));
    if(!avail.length) return;
    const col = avail[Math.floor(Math.random()*avail.length)];
    usedCols.add(col);
    const p = poems[Math.floor(Math.random()*poems.length)];
    const el = document.createElement("div");
    el.className = "fly-poem"; el.style.writingMode = "vertical-rl"; el.style.textOrientation = "upright";
    el.style.fontSize = (18 + Math.random()*30) + "px";
    el.style.opacity = (0.3 + Math.random()*0.45);
    el.style.left = col + "%";
    el.innerHTML = p.l + '<span class="au">—— ' + p.a + "</span>";
    flyLayer.appendChild(el);
    setTimeout(()=>{ el.remove(); usedCols.delete(col); }, 20000);
}
// 一次性铺满 9 列，每列随机处于动画不同阶段
function spawnRandom(initial){
    if(usedCols.size >= 9) return;
    const cols = [2,12,22,32,42,55,68,80,90];
    let avail = cols.filter(c=>!usedCols.has(c));
    if(!avail.length) return;
    const col = avail[Math.floor(Math.random()*avail.length)];
    usedCols.add(col);
    const p = poems[Math.floor(Math.random()*poems.length)];
    const el = document.createElement("div");
    el.className = "fly-poem"; el.style.writingMode = "vertical-rl"; el.style.textOrientation = "upright";
    el.style.fontSize = (18 + Math.random()*30) + "px";
    el.style.opacity = (0.3 + Math.random()*0.45);
    el.style.left = col + "%";
    el.innerHTML = p.l + '<span class="au">—— ' + p.a + "</span>";
    if(initial){ el.style.animationDelay = (-Math.random()*18) + "s"; }
    flyLayer.appendChild(el);
    setTimeout(()=>{ el.remove(); usedCols.delete(col); }, 20000);
}
// 立刻铺满
for(let i=0;i<9;i++) spawnRandom(true);
// 补位

        (function () {
            const gate = document.getElementById('gate');
            // 本会话已通过门禁（站内点 logo 回到首页）→ 直接进首页，不弹门禁
            if (sessionStorage.getItem('poetry_gate_passed')) {
                gate.style.display = 'none';
            } else {
                gate.style.display = 'flex';
            }

            const logged = localStorage.getItem('poetry_user');
            const title = document.querySelector('#gate .gate-title');
            const sub = document.querySelector('#gate .gate-sub');
            const err = document.getElementById('gateErr');
            const uIn = document.getElementById('gateUser');
            const pIn = document.getElementById('gatePass');
            const pass2 = document.getElementById('gatePass2');
            const submit = document.getElementById('gateSubmit');
            const sw = document.getElementById('gateSwitch');
            const hint = document.querySelector('#gate .auth-hint');
            const pwdHint = document.getElementById('gatePwdHint');
            const eye = document.getElementById('gateEye');

            if (logged) {
                // 已登录：无需重新输密码，直接进入
                function renderLoggedIn() {
                    title.innerHTML = t('auth.gateTitle');
                    sub.innerHTML = t('auth.welcomeBack') + '，' + logged;
                    uIn.style.display = 'none';
                    pIn.style.display = 'none';
                    pass2.style.display = 'none';
                    sw.style.display = 'none';
                    hint.style.display = 'none';
                    pwdHint.style.display = 'none';
                    eye.style.display = 'none';
                    err.textContent = '';
                    submit.innerHTML = t('auth.enter');
                }
                renderLoggedIn();
                submit.onclick = () => {
                    sessionStorage.setItem('poetry_gate_passed', '1');
                    gate.style.display = 'none';
                };
                window.addEventListener('langchange', renderLoggedIn);
            } else {
                // 未登录：登录 / 注册
                let mode = 'login';
                function setMode(m) {
                    mode = m;
                    title.innerHTML = t(m === 'login' ? 'auth.title' : 'auth.titleReg');
                    submit.innerHTML = t(m === 'login' ? 'auth.submit' : 'auth.submitReg');
                    sw.innerHTML = t(m === 'login' ? 'auth.toReg' : 'auth.toLogin');
                    pass2.style.display = m === 'login' ? 'none' : 'block';
                    pwdHint.style.display = m === 'login' ? 'none' : 'block';
                    err.textContent = '';
                }
                // 密码防偷窥（仅切换明文/密文，图标不变）
                eye.onclick = () => {
                    pIn.type = pIn.type === 'password' ? 'text' : 'password';
                };
                sw.onclick = () => setMode(mode === 'login' ? 'register' : 'login');
                submit.onclick = () => {
                    const u = uIn.value.trim();
                    const p = pIn.value;
                    const p2 = pass2.value;
                    err.textContent = '';
                    if (!u || !p) { err.textContent = t('auth.errFill'); return; }
                    const users = JSON.parse(localStorage.getItem('poetry_users') || '[]');
                    if (mode === 'register') {
                        if (pwdError(p)) { err.textContent = pwdError(p); return; }
                        if (p !== p2) { err.textContent = t('auth.errMatch'); return; }
                        if (users.some(x => x.u === u)) { err.textContent = t('auth.errExists'); return; }
                        users.push({ u, p });
                        localStorage.setItem('poetry_users', JSON.stringify(users));
                    } else {
                        const user = users.find(x => x.u === u && x.p === p);
                        if (!user) { err.textContent = t('auth.errWrong'); return; }
                    }
                    localStorage.setItem('poetry_user', u);
                    sessionStorage.setItem('poetry_gate_passed', '1');
                    gate.style.display = 'none';   // 登录成功，进入首页
                    if (window.renderAuth) window.renderAuth();
                };
                window.addEventListener('langchange', () => setMode(mode));
            }
        })();
    </script>
</body>
</html>
